name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# This forces the build commands to run inside your subfolder
defaults:
  run:
    working-directory: tutoring-website/tutoring-personal-site

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Points to your lockfile in the subfolder
          cache-dependency-path: tutoring-website/tutoring-personal-site/package-lock.json

      - name: Install dependencies
        # By adding the linux platform explicitly, npm pulls down the missing file
        run: |
          npm ci
          npm install --save-optional lightningcss-linux-x64-gnu


      - name: Build project
        run: npm run build

      # Crucial fix: bypasses Jekyll so GitHub Pages reads underscore assets
      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This path is relative to the repository root
          path: 'tutoring-website/tutoring-personal-site/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
